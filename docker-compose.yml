name: omni-proxy-ai

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_LOCAL_AUDIO: ${ENABLE_LOCAL_AUDIO:-false}
        ENABLE_LOCAL_IMAGES: ${ENABLE_LOCAL_IMAGES:-false}
    init: true
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/omni_proxy.sqlite3}
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_AUTH_REQUIRED: ${ADMIN_AUTH_REQUIRED:-false}
      DASHBOARD_AUTH_REQUIRED: ${DASHBOARD_AUTH_REQUIRED:-false}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      AUTH_FAILURES_PER_MINUTE: ${AUTH_FAILURES_PER_MINUTE:-30}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-0.1}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-4096}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-300}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-}
      UPSTREAM_DEPLOYMENTS_JSON: "${UPSTREAM_DEPLOYMENTS_JSON:-[]}"
      TIKTOKEN_ENCODING: ${TIKTOKEN_ENCODING:-cl100k_base}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BUILD_ENABLED: ${BUILD_ENABLED:-false}
      JOB_WORKSPACE_ROOTS: ${JOB_WORKSPACE_ROOTS:-}
      JOBS_MAX_ACTIVE_PER_KEY: ${JOBS_MAX_ACTIVE_PER_KEY:-4}
      JOBS_LEASE_SECONDS: ${JOBS_LEASE_SECONDS:-60}
      JOBS_RETENTION_DAYS: ${JOBS_RETENTION_DAYS:-0}
      JOB_TEST_LEASE_SECONDS: ${JOB_TEST_LEASE_SECONDS:-60}
      JOB_TEST_TIMEOUT_SECONDS: ${JOB_TEST_TIMEOUT_SECONDS:-30}
      TOKEN_BUDGET_TIMEZONE: ${TOKEN_BUDGET_TIMEZONE:-Europe/Rome}
      DEFAULT_BUDGET_OUTPUT_TOKENS: ${DEFAULT_BUDGET_OUTPUT_TOKENS:-4096}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-33554432}
      REQUEST_BODY_TIMEOUT_SECONDS: ${REQUEST_BODY_TIMEOUT_SECONDS:-30}
      MAX_CONCURRENT_API_REQUESTS: ${MAX_CONCURRENT_API_REQUESTS:-16}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-20971520}
      FILE_STORAGE_BYTES_PER_KEY: ${FILE_STORAGE_BYTES_PER_KEY:-104857600}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-7}
      FILE_PROCESSING_TIMEOUT_SECONDS: ${FILE_PROCESSING_TIMEOUT_SECONDS:-60}
      FILE_OCR_LANGUAGES: ${FILE_OCR_LANGUAGES:-eng}
      FILE_MAX_VIDEO_SECONDS: ${FILE_MAX_VIDEO_SECONDS:-120}
      FILE_VIDEO_FRAMES: ${FILE_VIDEO_FRAMES:-4}
      FILE_MAX_AUDIO_SECONDS: ${FILE_MAX_AUDIO_SECONDS:-300}
      AUDIO_BACKEND_URL: ${AUDIO_BACKEND_URL:-}
      AUDIO_API_KEY: ${AUDIO_API_KEY:-}
      AUDIO_MODEL: ${AUDIO_MODEL:-whisper-1}
      AUDIO_LOCAL_MODEL: ${AUDIO_LOCAL_MODEL:-}
      AUDIO_TIMEOUT_SECONDS: ${AUDIO_TIMEOUT_SECONDS:-120}
      AUDIO_INPUT_TOKENS_PER_SECOND: ${AUDIO_INPUT_TOKENS_PER_SECOND:-50}
      SPEECH_TIMEOUT_SECONDS: ${SPEECH_TIMEOUT_SECONDS:-45}
      SPEECH_MAX_SECONDS: ${SPEECH_MAX_SECONDS:-120}
      SPEECH_OUTPUT_TOKENS_PER_SECOND: ${SPEECH_OUTPUT_TOKENS_PER_SECOND:-50}
      IMAGE_BACKEND_URL: ${IMAGE_BACKEND_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_LOCAL_MODEL: ${IMAGE_LOCAL_MODEL:-}
      IMAGE_LOCAL_STEPS: ${IMAGE_LOCAL_STEPS:-20}
      IMAGE_TIMEOUT_SECONDS: ${IMAGE_TIMEOUT_SECONDS:-120}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-1572864}
      IMAGE_OUTPUT_TOKENS_PER_MEGAPIXEL: ${IMAGE_OUTPUT_TOKENS_PER_MEGAPIXEL:-4096}
      CODEX_CLIENT_LABEL: ${CODEX_CLIENT_LABEL:-Codex CLI}
      GEMINI_CLIENT_LABEL: ${GEMINI_CLIENT_LABEL:-Antigravity CLI}
      CLAUDE_CLIENT_LABEL: ${CLAUDE_CLIENT_LABEL:-Claude Code 2.1.218}
      CODEX_BROKER_URL: http://codex-broker:8788
      GEMINI_BROKER_URL: http://antigravity-broker:8789
      CLAUDE_BROKER_URL: http://claude-broker:8787
      PROVIDER_VAULT_KEY: ${PROVIDER_VAULT_KEY:-}
      PROVIDER_BROKER_TIMEOUT_SECONDS: ${PROVIDER_BROKER_TIMEOUT_SECONDS:-25}
      PROVIDER_COMPLETION_TIMEOUT_SECONDS: ${PROVIDER_COMPLETION_TIMEOUT_SECONDS:-600}
      MAINTENANCE_RUNNER_URL: http://maintenance-runner:8790
      MAINTENANCE_WORKSPACE_NAME: ${MAINTENANCE_WORKSPACE_NAME:-OmniProxy AI}
      MCP_CONNECT_TIMEOUT_SECONDS: ${MCP_CONNECT_TIMEOUT_SECONDS:-15}
      MCP_CALL_TIMEOUT_SECONDS: ${MCP_CALL_TIMEOUT_SECONDS:-60}
      MCP_MAX_TOOL_CALLS: ${MCP_MAX_TOOL_CALLS:-4}
      MCP_MAX_RESULT_CHARACTERS: ${MCP_MAX_RESULT_CHARACTERS:-48000}
      DASHBOARD_ALLOWED_HOSTS: ${DASHBOARD_ALLOWED_HOSTS:-127.0.0.1,localhost,gateway}
      PROVIDER_VAULT_KEY_PATH: ${PROVIDER_VAULT_KEY_PATH:-/vault/omniproxy-vault.key}
    volumes:
      - gateway_data:/data
      - gateway_vault:/vault
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      codex-broker:
        condition: service_healthy
      antigravity-broker:
        condition: service_healthy
      claude-broker:
        condition: service_healthy
      maintenance-runner:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - codex_link
      - antigravity_link
      - claude_link
      - maintenance_link

  maintenance-runner:
    build:
      context: .
      dockerfile: maintenance-runner/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DOCKER_CONFIG: /tmp/docker-config
    volumes:
      - .:/workspace:ro
      - ./codex-broker/version.txt:/workspace/codex-broker/version.txt:rw
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - maintenance_link

  codex-broker:
    build:
      context: .
      dockerfile: codex-broker/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      CODEX_AUTH_TTL_MS: ${CODEX_AUTH_TTL_MS:-600000}
      PROVIDER_EXECUTION_TIMEOUT_MS: ${PROVIDER_EXECUTION_TIMEOUT_MS:-600000}
    volumes:
      - codex_auth:/home/codex/.codex
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - codex_link
      - codex_egress

  claude-broker:
    build:
      context: .
      dockerfile: claude-broker/Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.218}
    init: true
    restart: unless-stopped
    environment:
      CLAUDE_CONFIG_DIR: /home/claude/.claude
      CLAUDE_AUTH_TTL_MS: ${CLAUDE_AUTH_TTL_MS:-300000}
      PROVIDER_EXECUTION_TIMEOUT_MS: ${PROVIDER_EXECUTION_TIMEOUT_MS:-600000}
    volumes:
      - claude_auth:/home/claude/.claude
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - claude_link
      - claude_egress

  antigravity-broker:
    build:
      context: .
      dockerfile: antigravity-broker/Dockerfile
      args:
        ANTIGRAVITY_CLI_VERSION: ${ANTIGRAVITY_VERSION_OVERRIDE:-}
        ANTIGRAVITY_CLI_SHA256_AMD64: ${ANTIGRAVITY_SHA256_AMD64_OVERRIDE:-}
        ANTIGRAVITY_CLI_SHA256_ARM64: ${ANTIGRAVITY_SHA256_ARM64_OVERRIDE:-}
    init: true
    restart: unless-stopped
    environment:
      ANTIGRAVITY_AUTH_TTL_MS: ${ANTIGRAVITY_AUTH_TTL_MS:-600000}
      PROVIDER_EXECUTION_TIMEOUT_MS: ${PROVIDER_EXECUTION_TIMEOUT_MS:-600000}
    volumes:
      - antigravity_auth:/home/antigravity/.gemini
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8789/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - antigravity_link
      - antigravity_egress

  ollama:
    profiles: ["managed-ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama-pull:
    profiles: ["managed-ollama"]
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:8b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  gateway_data:
  gateway_vault:
  ollama_data:
  codex_auth:
  claude_auth:
  antigravity_auth:

networks:
  default:
    name: ${AI_GATEWAY_NETWORK:-omni-proxy-ai-network}
  codex_link:
    internal: true
  antigravity_link:
    internal: true
  claude_link:
    internal: true
  maintenance_link:
    internal: true
  codex_egress:
  antigravity_egress:
  claude_egress:
