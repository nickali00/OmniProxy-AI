name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q app scripts conformance tests

      - name: Check dashboard JavaScript syntax
        run: |
          node --check app/static/dashboard.js
          node --check app/static/dashboard-i18n.js
          node --check app/static/admin-login.js
          node --check app/static/team.js
          node --check codex-broker/server.mjs
          node --check antigravity-broker/server.mjs
          node --check claude-broker/server.mjs

      - name: Run broker and dashboard JavaScript tests
        run: >-
          node --test
          codex-broker/client-tools.test.mjs
          codex-broker/tool-policy.test.mjs
          antigravity-broker/headless.test.mjs
          antigravity-broker/models.test.mjs
          provider-common/runtime.test.mjs
          tests/dashboard-groups.test.cjs

      - name: Check public OpenAPI artifact
        run: python -m scripts.export_openapi --check

      - name: Validate Docker Compose configurations
        run: |
          docker compose config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.gpu.yml \
            config --quiet

      - name: Run tests
        run: pytest -q
